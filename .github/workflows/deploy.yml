# Rebuilds the site from Sanity content and publishes it to Firebase Hosting.
# Runs when: an editor publishes in Sanity (webhook), code is pushed to main, or someone clicks "Run workflow".
name: Build and deploy

on:
  repository_dispatch:
    types: [sanity-publish]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: housegames-parampatel
          channelId: live
